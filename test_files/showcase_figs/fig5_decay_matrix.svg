<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect width="920" height="520" fill="#ffffff"/>
  <text x="60" y="60" font-size="30" font-weight="700" fill="#0b0b0b">The intra-chunk decay matrix (L&#215;L)</text>
  <text x="60" y="96" font-size="18" fill="#52514e">Lower-triangular = causal (a token sees only the past); the diagonal decay makes older tokens fade.</text>

  <!-- matrix grid 8x8 -->
  <g transform="translate(120,140)">
    <!-- cells: row i, col j. j<=i lower triangle = decay gradient (darker green nearer diagonal), j>i zero -->
    <!-- We render programmatically-styled cells manually -->
    <!-- row 0 -->
    <rect x="0"   y="0"   width="40" height="40" fill="#199e70"/>
    <rect x="40"  y="0"   width="40" height="40" fill="#eeede6"/><rect x="80" y="0" width="40" height="40" fill="#eeede6"/><rect x="120" y="0" width="40" height="40" fill="#eeede6"/><rect x="160" y="0" width="40" height="40" fill="#eeede6"/><rect x="200" y="0" width="40" height="40" fill="#eeede6"/><rect x="240" y="0" width="40" height="40" fill="#eeede6"/><rect x="280" y="0" width="40" height="40" fill="#eeede6"/>
    <!-- row 1 -->
    <rect x="0" y="40" width="40" height="40" fill="#7cc9ab"/><rect x="40" y="40" width="40" height="40" fill="#199e70"/>
    <rect x="80" y="40" width="40" height="40" fill="#eeede6"/><rect x="120" y="40" width="40" height="40" fill="#eeede6"/><rect x="160" y="40" width="40" height="40" fill="#eeede6"/><rect x="200" y="40" width="40" height="40" fill="#eeede6"/><rect x="240" y="40" width="40" height="40" fill="#eeede6"/><rect x="280" y="40" width="40" height="40" fill="#eeede6"/>
    <!-- row 2 -->
    <rect x="0" y="80" width="40" height="40" fill="#b7e0d0"/><rect x="40" y="80" width="40" height="40" fill="#7cc9ab"/><rect x="80" y="80" width="40" height="40" fill="#199e70"/>
    <rect x="120" y="80" width="40" height="40" fill="#eeede6"/><rect x="160" y="80" width="40" height="40" fill="#eeede6"/><rect x="200" y="80" width="40" height="40" fill="#eeede6"/><rect x="240" y="80" width="40" height="40" fill="#eeede6"/><rect x="280" y="80" width="40" height="40" fill="#eeede6"/>
    <!-- row 3 -->
    <rect x="0" y="120" width="40" height="40" fill="#d8efe6"/><rect x="40" y="120" width="40" height="40" fill="#b7e0d0"/><rect x="80" y="120" width="40" height="40" fill="#7cc9ab"/><rect x="120" y="120" width="40" height="40" fill="#199e70"/>
    <rect x="160" y="120" width="40" height="40" fill="#eeede6"/><rect x="200" y="120" width="40" height="40" fill="#eeede6"/><rect x="240" y="120" width="40" height="40" fill="#eeede6"/><rect x="280" y="120" width="40" height="40" fill="#eeede6"/>
    <!-- row 4 -->
    <rect x="0" y="160" width="40" height="40" fill="#eaf6f1"/><rect x="40" y="160" width="40" height="40" fill="#d8efe6"/><rect x="80" y="160" width="40" height="40" fill="#b7e0d0"/><rect x="120" y="160" width="40" height="40" fill="#7cc9ab"/><rect x="160" y="160" width="40" height="40" fill="#199e70"/>
    <rect x="200" y="160" width="40" height="40" fill="#eeede6"/><rect x="240" y="160" width="40" height="40" fill="#eeede6"/><rect x="280" y="160" width="40" height="40" fill="#eeede6"/>
    <!-- row 5 -->
    <rect x="0" y="200" width="40" height="40" fill="#eaf6f1"/><rect x="40" y="200" width="40" height="40" fill="#eaf6f1"/><rect x="80" y="200" width="40" height="40" fill="#d8efe6"/><rect x="120" y="200" width="40" height="40" fill="#b7e0d0"/><rect x="160" y="200" width="40" height="40" fill="#7cc9ab"/><rect x="200" y="200" width="40" height="40" fill="#199e70"/>
    <rect x="240" y="200" width="40" height="40" fill="#eeede6"/><rect x="280" y="200" width="40" height="40" fill="#eeede6"/>
    <!-- row 6 -->
    <rect x="0" y="240" width="40" height="40" fill="#eaf6f1"/><rect x="40" y="240" width="40" height="40" fill="#eaf6f1"/><rect x="80" y="240" width="40" height="40" fill="#eaf6f1"/><rect x="120" y="240" width="40" height="40" fill="#d8efe6"/><rect x="160" y="240" width="40" height="40" fill="#b7e0d0"/><rect x="200" y="240" width="40" height="40" fill="#7cc9ab"/><rect x="240" y="240" width="40" height="40" fill="#199e70"/>
    <rect x="280" y="240" width="40" height="40" fill="#eeede6"/>
    <!-- row 7 -->
    <rect x="0" y="280" width="40" height="40" fill="#eaf6f1"/><rect x="40" y="280" width="40" height="40" fill="#eaf6f1"/><rect x="80" y="280" width="40" height="40" fill="#eaf6f1"/><rect x="120" y="280" width="40" height="40" fill="#eaf6f1"/><rect x="160" y="280" width="40" height="40" fill="#d8efe6"/><rect x="200" y="280" width="40" height="40" fill="#b7e0d0"/><rect x="240" y="280" width="40" height="40" fill="#7cc9ab"/><rect x="280" y="280" width="40" height="40" fill="#199e70"/>
    <!-- grid lines -->
    <rect x="0" y="0" width="320" height="320" fill="none" stroke="#c3c2b7" stroke-width="1.5"/>
  </g>

  <!-- annotations -->
  <text x="120" y="130" font-size="14" fill="#898781">token j (source) &#8594;</text>
  <text x="105" y="300" font-size="14" fill="#898781" text-anchor="end" transform="rotate(-90 105 300)">token i (query) &#8594;</text>

  <line x1="470" y1="180" x2="440" y2="180" stroke="#199e70" stroke-width="1.5"/>
  <text x="480" y="176" font-size="16" font-weight="700" fill="#199e70">diagonal = self, strongest</text>
  <text x="480" y="198" font-size="14" fill="#52514e">weights decay moving away from the diagonal</text>

  <line x1="560" y1="250" x2="360" y2="250" stroke="#898781" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="480" y="278" font-size="16" font-weight="700" fill="#0b0b0b">upper triangle = 0 (the future is masked)</text>

  <text x="480" y="360" font-size="16" font-weight="700" fill="#d95926">The trap: materializing this dense L&#215;L matrix is expensive.</text>
  <text x="480" y="384" font-size="15" fill="#52514e">We fold the decay into the operands instead &#8212; the</text>
  <text x="480" y="404" font-size="15" fill="#52514e">giant matrix is never built. cumsum &#8594; matmul vs triangular ones.</text>

  <text x="120" y="500" font-size="15" fill="#0b0b0b">Same math as the GPU reference, re-expressed as ops Spyre supports (matmuls + masks), fp16-safe.</text>
</svg>
