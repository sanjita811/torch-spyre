<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" font-family="'IBM Plex Sans','IBM Plex Sans Var',system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect width="1000" height="460" fill="#ffffff"/>
  <text x="60" y="56" font-size="26" font-weight="600" fill="#161616">Measured best-config per sequence length</text>
  <text x="60" y="88" font-size="17" fill="#525252">Swept on Spyre: chunk size, number of chunks, BH tiles and intra path &#8212; chosen by measurement.</text>

  <!-- table geometry -->
  <!-- columns: x centers -> 150, 360, 530, 690, 860 ; left edge 60, right edge 940 -->
  <!-- header band -->
  <rect x="60" y="120" width="880" height="52" fill="#161616"/>
  <text x="150" y="153" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Seq length</text>
  <text x="360" y="153" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Chunk (L)</text>
  <text x="530" y="153" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Chunks (C)</text>
  <text x="690" y="153" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">BH tiles</text>
  <text x="860" y="153" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Intra path</text>

  <!-- row 1 (4K) -->
  <rect x="60" y="172" width="880" height="56" fill="#ffffff"/>
  <text x="150" y="207" font-size="17" font-weight="600" fill="#0f62fe" text-anchor="middle">4K</text>
  <text x="360" y="207" font-size="17" fill="#161616" text-anchor="middle">64</text>
  <text x="530" y="207" font-size="17" fill="#161616" text-anchor="middle">64</text>
  <text x="690" y="207" font-size="17" fill="#161616" text-anchor="middle">8</text>
  <text x="860" y="207" font-size="16" fill="#198038" text-anchor="middle">factored</text>

  <!-- row 2 (8K) -->
  <rect x="60" y="228" width="880" height="56" fill="#f4f4f4"/>
  <text x="150" y="263" font-size="17" font-weight="600" fill="#0f62fe" text-anchor="middle">8K</text>
  <text x="360" y="263" font-size="17" fill="#161616" text-anchor="middle">128</text>
  <text x="530" y="263" font-size="17" fill="#161616" text-anchor="middle">64</text>
  <text x="690" y="263" font-size="17" fill="#161616" text-anchor="middle">16</text>
  <text x="860" y="263" font-size="16" fill="#198038" text-anchor="middle">factored</text>

  <!-- row 3 (16K) -->
  <rect x="60" y="284" width="880" height="56" fill="#ffffff"/>
  <text x="150" y="319" font-size="17" font-weight="600" fill="#0f62fe" text-anchor="middle">16K</text>
  <text x="360" y="319" font-size="17" fill="#161616" text-anchor="middle">256</text>
  <text x="530" y="319" font-size="17" fill="#161616" text-anchor="middle">64</text>
  <text x="690" y="319" font-size="17" fill="#161616" text-anchor="middle">32</text>
  <text x="860" y="319" font-size="16" fill="#198038" text-anchor="middle">factored</text>

  <!-- row 4 (32K) -->
  <rect x="60" y="340" width="880" height="56" fill="#f4f4f4"/>
  <text x="150" y="375" font-size="17" font-weight="600" fill="#0f62fe" text-anchor="middle">32K</text>
  <text x="360" y="375" font-size="17" fill="#161616" text-anchor="middle">512</text>
  <text x="530" y="375" font-size="17" fill="#161616" text-anchor="middle">64</text>
  <text x="690" y="375" font-size="17" fill="#161616" text-anchor="middle">32</text>
  <text x="860" y="375" font-size="16" fill="#eb6834" text-anchor="middle">masked</text>

  <!-- column separators (light) -->
  <g stroke="#e0e0e0" stroke-width="1">
    <line x1="250" y1="172" x2="250" y2="396"/>
    <line x1="445" y1="172" x2="445" y2="396"/>
    <line x1="615" y1="172" x2="615" y2="396"/>
    <line x1="775" y1="172" x2="775" y2="396"/>
  </g>
  <!-- outer + bottom rule -->
  <rect x="60" y="120" width="880" height="276" fill="none" stroke="#e0e0e0" stroke-width="1.5"/>

  <text x="60" y="432" font-size="14" fill="#525252">C pinned at 64; L and BH tiles scale with T (fastest per-T from the device sweep). Intra switches to the fp16-robust masked path at 32K.</text>
</svg>
