<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect width="920" height="480" fill="#ffffff"/>
  <text x="60" y="60" font-size="30" font-weight="700" fill="#0b0b0b">Why State Space Models: cost scales linearly, not quadratically</text>
  <text x="60" y="96" font-size="18" fill="#52514e">Transformer attention is O(L&#178;) in sequence length; Mamba-2 / SSD is O(L) &#8212; the win grows with context.</text>

  <!-- axes -->
  <line x1="110" y1="400" x2="860" y2="400" stroke="#c3c2b7" stroke-width="2"/>
  <line x1="110" y1="140" x2="110" y2="400" stroke="#c3c2b7" stroke-width="2"/>
  <text x="485" y="452" font-size="16" fill="#52514e" text-anchor="middle">Sequence length  L  &#8594;</text>
  <text x="70" y="270" font-size="16" fill="#52514e" text-anchor="middle" transform="rotate(-90 70 270)">Compute cost &#8594;</text>

  <!-- quadratic curve (Transformer) -->
  <path d="M110 400 Q 620 400 820 150" fill="none" stroke="#d95926" stroke-width="4"/>
  <text x="770" y="140" font-size="18" font-weight="700" fill="#d95926" text-anchor="end">Transformer  O(L&#178;)</text>

  <!-- linear line (SSM) -->
  <line x1="110" y1="400" x2="820" y2="300" stroke="#199e70" stroke-width="4"/>
  <text x="828" y="300" font-size="18" font-weight="700" fill="#199e70">SSM  O(L)</text>

  <!-- gap annotation -->
  <line x1="820" y1="150" x2="820" y2="300" stroke="#898781" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="808" y="230" font-size="14" fill="#898781" text-anchor="end">this gap is the</text>
  <text x="808" y="248" font-size="14" fill="#898781" text-anchor="end">long-context payoff</text>

  <text x="110" y="460" font-size="15" fill="#0b0b0b">For long documents and long context, SSMs are dramatically cheaper &#8212; the architecture customers increasingly want.</text>
</svg>
