<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="'IBM Plex Sans','IBM Plex Sans Var',system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect width="1120" height="600" fill="#ffffff"/>
  <text x="50" y="52" font-size="26" font-weight="600" fill="#161616">SSD: the recurrence is one structured matmul</text>
  <text x="50" y="84" font-size="17" fill="#525252">Y = M X, where M = L &#8728; (C B&#7488;): token similarity (C B&#7488;) masked and decayed by L.</text>

  <!-- ============ Y = M X row of blocks ============ -->
  <!-- Y vector -->
  <text x="95" y="150" font-size="18" font-weight="600" fill="#161616" text-anchor="middle">Y</text>
  <text x="95" y="172" font-size="13" fill="#6f6f6f" text-anchor="middle">outputs</text>
  <g>
    <rect x="70" y="185" width="50" height="260" rx="4" fill="#fbe9df" stroke="#d95926" stroke-width="1.5"/>
    <line x1="70" y1="250" x2="120" y2="250" stroke="#f3c4ab" stroke-width="1"/>
    <line x1="70" y1="315" x2="120" y2="315" stroke="#f3c4ab" stroke-width="1"/>
    <line x1="70" y1="380" x2="120" y2="380" stroke="#f3c4ab" stroke-width="1"/>
  </g>

  <text x="150" y="325" font-size="30" fill="#161616" text-anchor="middle">=</text>

  <!-- M matrix (lower-triangular, decaying) -->
  <text x="330" y="150" font-size="18" font-weight="600" fill="#161616" text-anchor="middle">M  =  L &#8728; (C B&#7488;)</text>
  <text x="330" y="172" font-size="13" fill="#6f6f6f" text-anchor="middle">causal, decaying weight of past on present</text>
  <!-- 5x5 grid, cell 52, origin x=190 y=185 -->
  <!-- diagonal + lower filled with fading blue by distance from diagonal; upper masked -->
  <!-- row 0 -->
  <rect x="190" y="185" width="52" height="52" fill="#0f62fe" fill-opacity="1.0"/>
  <rect x="242" y="185" width="52" height="52" fill="#f4f4f4"/><rect x="294" y="185" width="52" height="52" fill="#f4f4f4"/><rect x="346" y="185" width="52" height="52" fill="#f4f4f4"/><rect x="398" y="185" width="52" height="52" fill="#f4f4f4"/>
  <!-- row 1 -->
  <rect x="190" y="237" width="52" height="52" fill="#0f62fe" fill-opacity="0.62"/>
  <rect x="242" y="237" width="52" height="52" fill="#0f62fe" fill-opacity="1.0"/>
  <rect x="294" y="237" width="52" height="52" fill="#f4f4f4"/><rect x="346" y="237" width="52" height="52" fill="#f4f4f4"/><rect x="398" y="237" width="52" height="52" fill="#f4f4f4"/>
  <!-- row 2 -->
  <rect x="190" y="289" width="52" height="52" fill="#0f62fe" fill-opacity="0.38"/>
  <rect x="242" y="289" width="52" height="52" fill="#0f62fe" fill-opacity="0.62"/>
  <rect x="294" y="289" width="52" height="52" fill="#0f62fe" fill-opacity="1.0"/>
  <rect x="346" y="289" width="52" height="52" fill="#f4f4f4"/><rect x="398" y="289" width="52" height="52" fill="#f4f4f4"/>
  <!-- row 3 -->
  <rect x="190" y="341" width="52" height="52" fill="#0f62fe" fill-opacity="0.23"/>
  <rect x="242" y="341" width="52" height="52" fill="#0f62fe" fill-opacity="0.38"/>
  <rect x="294" y="341" width="52" height="52" fill="#0f62fe" fill-opacity="0.62"/>
  <rect x="346" y="341" width="52" height="52" fill="#0f62fe" fill-opacity="1.0"/>
  <rect x="398" y="341" width="52" height="52" fill="#f4f4f4"/>
  <!-- row 4 -->
  <rect x="190" y="393" width="52" height="52" fill="#0f62fe" fill-opacity="0.14"/>
  <rect x="242" y="393" width="52" height="52" fill="#0f62fe" fill-opacity="0.23"/>
  <rect x="294" y="393" width="52" height="52" fill="#0f62fe" fill-opacity="0.38"/>
  <rect x="346" y="393" width="52" height="52" fill="#0f62fe" fill-opacity="0.62"/>
  <rect x="398" y="393" width="52" height="52" fill="#0f62fe" fill-opacity="1.0"/>
  <!-- grid outline over masked cells -->
  <g fill="none" stroke="#e0e0e0" stroke-width="1">
    <rect x="242" y="185" width="52" height="52"/><rect x="294" y="185" width="52" height="52"/><rect x="346" y="185" width="52" height="52"/><rect x="398" y="185" width="52" height="52"/>
    <rect x="294" y="237" width="52" height="52"/><rect x="346" y="237" width="52" height="52"/><rect x="398" y="237" width="52" height="52"/>
    <rect x="346" y="289" width="52" height="52"/><rect x="398" y="289" width="52" height="52"/>
    <rect x="398" y="341" width="52" height="52"/>
  </g>
  <rect x="190" y="185" width="260" height="260" fill="none" stroke="#c6c6c6" stroke-width="1.5"/>

  <text x="470" y="325" font-size="30" fill="#161616" text-anchor="middle">&#215;</text>

  <!-- X vector -->
  <text x="535" y="150" font-size="18" font-weight="600" fill="#161616" text-anchor="middle">X</text>
  <text x="535" y="172" font-size="13" fill="#6f6f6f" text-anchor="middle">inputs</text>
  <g>
    <rect x="510" y="185" width="50" height="260" rx="4" fill="#eef7f2" stroke="#199e70" stroke-width="1.5"/>
    <line x1="510" y1="250" x2="560" y2="250" stroke="#bfe3d1" stroke-width="1"/>
    <line x1="510" y1="315" x2="560" y2="315" stroke="#bfe3d1" stroke-width="1"/>
    <line x1="510" y1="380" x2="560" y2="380" stroke="#bfe3d1" stroke-width="1"/>
  </g>

  <!-- ============ legend / decode ============ -->
  <line x1="620" y1="185" x2="620" y2="445" stroke="#e0e0e0" stroke-width="1.5"/>

  <text x="650" y="200" font-size="16" font-weight="600" fill="#161616">Reading the matrix M</text>

  <rect x="650" y="220" width="26" height="26" fill="#0f62fe" fill-opacity="1.0"/>
  <text x="686" y="238" font-size="14" fill="#525252">Diagonal: a token&#8217;s own input, full weight</text>

  <rect x="650" y="256" width="26" height="26" fill="#0f62fe" fill-opacity="0.38"/>
  <text x="686" y="274" font-size="14" fill="#525252">Below: older tokens, weight decays with distance (L)</text>

  <rect x="650" y="292" width="26" height="26" fill="#f4f4f4" stroke="#c6c6c6" stroke-width="1"/>
  <text x="686" y="310" font-size="14" fill="#525252">Above: future tokens, masked (causal, not yet seen)</text>

  <text x="650" y="360" font-size="15" font-weight="600" fill="#161616">Row t = output y</text>
  <text x="762" y="360" font-size="15" fill="#161616">= weighted sum of inputs s &#8804; t</text>
  <text x="650" y="384" font-size="14" fill="#0f62fe" font-family="'IBM Plex Mono',monospace">y&#7511; = &#931;&#8347;&#8804;&#7511;  M&#7511;&#8347; &#183; x&#8347;</text>

  <text x="650" y="424" font-size="14" fill="#525252">C B&#7488; = how similar tokens t and s are (attention-like).</text>
  <text x="650" y="444" font-size="14" fill="#525252">L = how much of s survives the decay to reach t.</text>

  <!-- footer: recurrence tie-back -->
  <line x1="50" y1="490" x2="1070" y2="490" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="50" y="522" font-size="15" fill="#161616"><tspan font-weight="600">Same model, two views.</tspan>  Recurrence (one step at a time):</text>
  <text x="470" y="522" font-size="15" fill="#0f62fe" font-family="'IBM Plex Mono',monospace">h<tspan baseline-shift="sub" font-size="11">t</tspan> = A<tspan baseline-shift="sub" font-size="11">t</tspan>&#183;h<tspan baseline-shift="sub" font-size="11">t&#8722;1</tspan> + B<tspan baseline-shift="sub" font-size="11">t</tspan>&#183;x<tspan baseline-shift="sub" font-size="11">t</tspan>,   y<tspan baseline-shift="sub" font-size="11">t</tspan> = C<tspan baseline-shift="sub" font-size="11">t</tspan><tspan baseline-shift="super" font-size="11">&#8868;</tspan>&#183;h<tspan baseline-shift="sub" font-size="11">t</tspan></text>
  <text x="50" y="552" font-size="15" fill="#161616">Matrix (all at once, matmul-friendly):</text>
  <text x="470" y="552" font-size="15" fill="#0f62fe" font-family="'IBM Plex Mono',monospace">Y = M&#183;X,   M = L &#8728; (C B&#7488;)</text>
  <text x="50" y="582" font-size="14" fill="#8a6a00">SSD proves these are equal. Spyre runs the matrix view because it is built to multiply matrices.</text>
</svg>
