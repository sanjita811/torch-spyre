<svg xmlns="http://www.w3.org/2000/svg" width="920" height="320" viewBox="0 0 920 320" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect width="920" height="320" fill="#ffffff"/>
  <text x="60" y="60" font-size="30" font-weight="700" fill="#0b0b0b">The road to SSM serving on Spyre</text>
  <text x="60" y="96" font-size="18" fill="#52514e">The core kernel is done; each next step builds toward long-context inference.</text>

  <!-- connecting arrow -->
  <line x1="130" y1="190" x2="820" y2="190" stroke="#c3c2b7" stroke-width="3"/>
  <polygon points="820,190 806,182 806,198" fill="#c3c2b7"/>

  <!-- step 1 DONE -->
  <circle cx="140" cy="190" r="18" fill="#199e70"/>
  <path d="M132 190 l6 6 l10 -13" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="140" y="150" font-size="17" font-weight="700" fill="#199e70" text-anchor="middle">Core SSD kernel</text>
  <text x="140" y="240" font-size="15" fill="#199e70" text-anchor="middle" font-weight="700">DONE</text>
  <text x="140" y="262" font-size="13" fill="#898781" text-anchor="middle">on-device, to 32K</text>

  <!-- step 2 -->
  <circle cx="370" cy="190" r="18" fill="#ffffff" stroke="#8a897f" stroke-width="3"/>
  <text x="370" y="150" font-size="17" font-weight="700" fill="#52514e" text-anchor="middle">Full Mamba-2 layer</text>
  <text x="370" y="262" font-size="13" fill="#898781" text-anchor="middle">projections + gating</text>

  <!-- step 3 -->
  <circle cx="595" cy="190" r="18" fill="#ffffff" stroke="#8a897f" stroke-width="3"/>
  <text x="595" y="150" font-size="17" font-weight="700" fill="#52514e" text-anchor="middle">Decode step</text>
  <text x="595" y="262" font-size="13" fill="#898781" text-anchor="middle">autoregressive inference</text>

  <!-- step 4 -->
  <circle cx="820" cy="190" r="18" fill="#ffffff" stroke="#8a897f" stroke-width="3"/>
  <text x="820" y="150" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">SSM serving</text>
  <text x="820" y="262" font-size="13" fill="#898781" text-anchor="middle">long-context on Spyre</text>
</svg>
