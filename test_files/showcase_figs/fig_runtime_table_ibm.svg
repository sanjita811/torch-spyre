<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="'IBM Plex Sans','IBM Plex Sans Var',system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="60" y="56" font-size="26" font-weight="600" fill="#161616">Runtime by sequence length</text>
  <text x="60" y="88" font-size="17" fill="#525252">Warm = steady-state runtime (what inference sees).  Cold = one-time compile cost, paid once per shape.</text>

  <!-- header band -->
  <rect x="60" y="120" width="880" height="52" fill="#161616"/>
  <text x="200" y="153" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Seq length</text>
  <text x="500" y="153" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Warm  (runtime)</text>
  <text x="800" y="153" font-size="16" font-weight="600" fill="#c6c6c6" text-anchor="middle">Cold  (one-time compile)</text>

  <!-- row 1 (4K) -->
  <rect x="60" y="172" width="880" height="56" fill="#ffffff"/>
  <text x="200" y="207" font-size="17" font-weight="600" fill="#0f62fe" text-anchor="middle">4K</text>
  <text x="500" y="207" font-size="20" font-weight="700" fill="#161616" text-anchor="middle">370 ms</text>
  <text x="800" y="207" font-size="16" fill="#8d8d8d" text-anchor="middle">26 s</text>

  <!-- row 2 (8K) -->
  <rect x="60" y="228" width="880" height="56" fill="#f4f4f4"/>
  <text x="200" y="263" font-size="17" font-weight="600" fill="#0f62fe" text-anchor="middle">8K</text>
  <text x="500" y="263" font-size="20" font-weight="700" fill="#161616" text-anchor="middle">967 ms</text>
  <text x="800" y="263" font-size="16" fill="#8d8d8d" text-anchor="middle">72 s</text>

  <!-- row 3 (16K) -->
  <rect x="60" y="284" width="880" height="56" fill="#ffffff"/>
  <text x="200" y="319" font-size="17" font-weight="600" fill="#0f62fe" text-anchor="middle">16K</text>
  <text x="500" y="319" font-size="20" font-weight="700" fill="#161616" text-anchor="middle">3.9 s</text>
  <text x="800" y="319" font-size="16" fill="#8d8d8d" text-anchor="middle">105 s</text>

  <!-- row 4 (32K) -->
  <rect x="60" y="340" width="880" height="56" fill="#f4f4f4"/>
  <text x="200" y="375" font-size="17" font-weight="600" fill="#0f62fe" text-anchor="middle">32K</text>
  <text x="500" y="375" font-size="20" font-weight="700" fill="#161616" text-anchor="middle">12.3 s</text>
  <text x="800" y="375" font-size="16" fill="#8d8d8d" text-anchor="middle">101 s</text>

  <!-- column separators -->
  <g stroke="#e0e0e0" stroke-width="1">
    <line x1="340" y1="172" x2="340" y2="396"/>
    <line x1="650" y1="172" x2="650" y2="396"/>
  </g>
  <rect x="60" y="120" width="880" height="276" fill="none" stroke="#e0e0e0" stroke-width="1.5"/>

  <text x="60" y="438" font-size="14" fill="#525252">Best config per length. Warm growth is super-linear &#8212; driven by the dense O(C&#178;) inter-chunk scan. Cold is a build cost, not inference.</text>
</svg>
