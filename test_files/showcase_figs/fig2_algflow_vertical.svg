<svg xmlns="http://www.w3.org/2000/svg" width="620" height="900" viewBox="0 0 620 900" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect width="620" height="900" fill="#ffffff"/>

  <!-- STAGE 1 -->
  <g>
    <rect x="150" y="30" width="320" height="150" rx="16" fill="#f9f9f7" stroke="#2a78d6" stroke-width="3"/>
    <text x="310" y="70" font-size="18" font-weight="700" fill="#2a78d6" text-anchor="middle">STAGE 1</text>
    <text x="310" y="112" font-size="30" font-weight="700" fill="#0b0b0b" text-anchor="middle">Intra-chunk</text>
    <text x="310" y="150" font-size="19" fill="#52514e" text-anchor="middle">local mixing within a chunk</text>
  </g>
  <text x="310" y="212" font-size="34" fill="#898781" text-anchor="middle">&#8595;</text>

  <!-- STAGE 2 -->
  <g>
    <rect x="150" y="230" width="320" height="150" rx="16" fill="#f9f9f7" stroke="#eb6834" stroke-width="3"/>
    <text x="310" y="270" font-size="18" font-weight="700" fill="#eb6834" text-anchor="middle">STAGE 2</text>
    <text x="310" y="312" font-size="30" font-weight="700" fill="#0b0b0b" text-anchor="middle">Chunk states</text>
    <text x="310" y="350" font-size="19" fill="#52514e" text-anchor="middle">summarize each chunk to a state</text>
  </g>
  <text x="310" y="412" font-size="34" fill="#898781" text-anchor="middle">&#8595;</text>

  <!-- STAGE 3 -->
  <g>
    <rect x="150" y="430" width="320" height="150" rx="16" fill="#f9f9f7" stroke="#1baf7a" stroke-width="3"/>
    <text x="310" y="470" font-size="18" font-weight="700" fill="#1baf7a" text-anchor="middle">STAGE 3</text>
    <text x="310" y="512" font-size="30" font-weight="700" fill="#0b0b0b" text-anchor="middle">Chunk scan</text>
    <text x="310" y="550" font-size="19" fill="#52514e" text-anchor="middle">carry state across chunks</text>
  </g>
  <text x="310" y="612" font-size="34" fill="#898781" text-anchor="middle">&#8595;</text>

  <!-- STAGE 4 -->
  <g>
    <rect x="150" y="630" width="320" height="150" rx="16" fill="#f9f9f7" stroke="#eda100" stroke-width="3"/>
    <text x="310" y="670" font-size="18" font-weight="700" fill="#c98500" text-anchor="middle">STAGE 4</text>
    <text x="310" y="712" font-size="30" font-weight="700" fill="#0b0b0b" text-anchor="middle">Combine</text>
    <text x="310" y="750" font-size="19" fill="#52514e" text-anchor="middle">output Y</text>
  </g>

  <!-- caption -->
  <text x="310" y="838" font-size="18" fill="#0b0b0b" text-anchor="middle" font-weight="700">Fused into one compiled kernel</text>
  <text x="310" y="868" font-size="16" fill="#52514e" text-anchor="middle">Stage 3's recurrence is what makes SSMs linear-time</text>
</svg>
